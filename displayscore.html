<!DOCTYPE html>
<html>
<head>
  <title>Display</title>
  <style>
    body {
      margin:0;
      background: linear-gradient(to right, red 50%, blue 50%);
      color:white;
      font-family: Arial;
      text-align:center;
    }

    .container {
      display:flex;
      height:100vh;
    }

    .side {
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

    .name {
      font-size:110px;
      margin-bottom:20px;
    }

    .score {
      font-size:500px;
      font-weight:bold;
    }

    .center {
      position:absolute;
      top:20px;
      width:100%;
      text-align:center;
      font-size:120px;
      font-weight:bold;
    }
  </style>
</head>
<body>

<div class="center" id="time">02:00</div>

<div class="container">
  <div class="side">
    <div class="name" id="redName">RED</div>
    <div class="score" id="red">0</div>
  </div>

  <div class="side">
    <div class="name" id="blueName">BLUE</div>
    <div class="score" id="blue">0</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDPV8RjTm_sj_IQ_PwFa3zTLWeFhWjiSj4",
  authDomain: "teakwondo-score.firebaseapp.com",
  databaseURL: "https://teakwondo-score-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "teakwondo-score",
};


firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// คะแนน
db.ref('red').on('value', snap=>{
  document.getElementById("red").innerText = snap.val() || 0;
});
db.ref('blue').on('value', snap=>{
  document.getElementById("blue").innerText = snap.val() || 0;
});

// ชื่อ
db.ref('redName').on('value', snap=>{
  document.getElementById("redName").innerText = snap.val() || "RED";
});
db.ref('blueName').on('value', snap=>{
  document.getElementById("blueName").innerText = snap.val() || "BLUE";
});

// เวลา
db.ref("time").on("value", snap=>{
  let t = snap.val() || 120;
  let m = String(Math.floor(t/60)).padStart(2,'0');
  let s = String(t%60).padStart(2,'0');
  document.getElementById("time").innerText = m+":"+s;
});
</script>

</body>
</html>
